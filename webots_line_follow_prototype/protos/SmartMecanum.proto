#VRML_SIM R2025a utf8

# PROTOTYPE: approximate 1 kg, 300 x 300 x 150 mm competition mecanum car.
# Assumption pending measurement: 80 mm wheel diameter.

PROTO SmartMecanum [
  field SFVec3f translation 0 0 0.04
  field SFRotation rotation 0 0 1 0
  field SFString name "smart_car_sim"
  field SFString controller "line_follow_sim"
  field SFBool supervisor TRUE
  field MFNode bodySlot []
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    supervisor IS supervisor
    children [
      Shape {
        appearance PBRAppearance {
          baseColor 0.08 0.22 0.42
          metalness 0.15
          roughness 0.35
        }
        geometry Box { size 0.26 0.22 0.06 }
      }
      Transform {
        translation 0 0 0.04
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.14 0.45 0.72
              metalness 0.1
              roughness 0.4
            }
            geometry Box { size 0.22 0.18 0.04 }
          }
        ]
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.10 -0.13 0
        }
        device [
          RotationalMotor {
            name "front_right_wheel_joint"
            maxVelocity 100
            maxTorque 2
          }
          PositionSensor { name "front_right_wheel_joint_sensor" }
        ]
        endPoint Solid {
          translation 0.10 -0.13 0
          name "wheel_fr"
          contactMaterial "InteriorWheelMat"
          children [
            Transform {
              scale 0.4 0.4 0.4
              children [
                Shape {
                  appearance DEF WHEEL_APPEARANCE PBRAppearance {
                    baseColor 0.08 0.08 0.08
                    roughness 0.85
                  }
                  geometry DEF WHEEL_RIGHT Mesh {
                    url [ "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/robots/rec/fabtino/protos/meshes/wheel1.dae" ]
                  }
                }
                Shape {
                  appearance DEF ROLLER_APPEARANCE PBRAppearance {
                    baseColor 0.28 0.28 0.28
                    metalness 0.15
                    roughness 0.65
                  }
                  geometry DEF ROLLERS_RIGHT Mesh {
                    url [ "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/robots/rec/fabtino/protos/meshes/rollers1.dae" ]
                  }
                }
              ]
            }
          ]
          boundingObject Pose {
            rotation 1 0 0 1.5708
            children [ DEF WHEEL_BO Cylinder { radius 0.04 height 0.03 } ]
          }
          physics DEF WHEEL_PHYSICS Physics { density -1 mass 0.04 }
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor -0.10 -0.13 0
        }
        device [
          RotationalMotor {
            name "back_right_wheel_joint"
            maxVelocity 100
            maxTorque 2
          }
          PositionSensor { name "back_right_wheel_joint_sensor" }
        ]
        endPoint Solid {
          translation -0.10 -0.13 0
          name "wheel_br"
          contactMaterial "ExteriorWheelMat"
          children [
            Transform {
              scale 0.4 0.4 0.4
              children [
                Shape {
                  appearance USE WHEEL_APPEARANCE
                  geometry DEF WHEEL_LEFT Mesh {
                    url [ "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/robots/rec/fabtino/protos/meshes/wheel2.dae" ]
                  }
                }
                Shape {
                  appearance USE ROLLER_APPEARANCE
                  geometry DEF ROLLERS_LEFT Mesh {
                    url [ "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/robots/rec/fabtino/protos/meshes/rollers2.dae" ]
                  }
                }
              ]
            }
          ]
          boundingObject Pose {
            rotation 1 0 0 1.5708
            children [ USE WHEEL_BO ]
          }
          physics USE WHEEL_PHYSICS
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.10 0.13 0
        }
        device [
          RotationalMotor {
            name "front_left_wheel_joint"
            maxVelocity 100
            maxTorque 2
          }
          PositionSensor { name "front_left_wheel_joint_sensor" }
        ]
        endPoint Solid {
          translation 0.10 0.13 0
          name "wheel_fl"
          contactMaterial "ExteriorWheelMat"
          children [
            Transform {
              rotation 0 0 1 3.14159265359
              scale 0.4 0.4 0.4
              children [
                Shape {
                  appearance USE WHEEL_APPEARANCE
                  geometry USE WHEEL_LEFT
                }
                Shape {
                  appearance USE ROLLER_APPEARANCE
                  geometry USE ROLLERS_LEFT
                }
              ]
            }
          ]
          boundingObject Pose {
            rotation 1 0 0 1.5708
            children [ USE WHEEL_BO ]
          }
          physics USE WHEEL_PHYSICS
        }
      }
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor -0.10 0.13 0
        }
        device [
          RotationalMotor {
            name "back_left_wheel_joint"
            maxVelocity 100
            maxTorque 2
          }
          PositionSensor { name "back_left_wheel_joint_sensor" }
        ]
        endPoint Solid {
          translation -0.10 0.13 0
          name "wheel_bl"
          contactMaterial "InteriorWheelMat"
          children [
            Transform {
              rotation 0 0 1 3.14159265359
              scale 0.4 0.4 0.4
              children [
                Shape {
                  appearance USE WHEEL_APPEARANCE
                  geometry USE WHEEL_RIGHT
                }
                Shape {
                  appearance USE ROLLER_APPEARANCE
                  geometry USE ROLLERS_RIGHT
                }
              ]
            }
          ]
          boundingObject Pose {
            rotation 1 0 0 1.5708
            children [ USE WHEEL_BO ]
          }
          physics USE WHEEL_PHYSICS
        }
      }
      Group { children IS bodySlot }
    ]
    boundingObject Group {
      children [
        Pose {
          translation 0 0 0
          children [ Box { size 0.26 0.22 0.06 } ]
        }
        Pose {
          translation 0 0 0.04
          children [ Box { size 0.22 0.18 0.04 } ]
        }
      ]
    }
    physics Physics {
      density -1
      mass 0.84
      centerOfMass [ 0 0 0.025 ]
    }
  }
}
